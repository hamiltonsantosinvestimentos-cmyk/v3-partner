name: E2E Tests (Governança de Documentos MPS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate de acesso (18/09/2026): falha o CI se alguma pagina interna do
  # sidebar (roles sem PARTNER/PARTNER_PRO/PARTNER_HE/STARTER/ENTERPRISE)
  # ficar sem requireRole() no servidor. Ver scripts/audit-page-role-gates.js
  # e o achado real que motivou isso (12 paginas expostas so pelo link
  # escondido no sidebar, incluindo pipeline inteiro de M&A vazando sem
  # nenhum gate). Job separado e leve: nao precisa de Playwright nem
  # segredos, so Node puro lendo arquivos do proprio repo.
  access-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auditar gate de acesso das paginas internas
        run: npm run audit:access

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Rodar suite E2E (dedupe, deal inexistente, path governado)
        run: npm run test:e2e

      - name: Upload relatório Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
