<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>V3 Partner — Posts Premium</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#02070f;font-family:Arial,sans-serif;color:#E8EDF5;padding:30px 20px}
  h1{text-align:center;font-size:1.8rem;font-weight:900;
    background:linear-gradient(90deg,#C4922E,#F5D99A,#C4922E);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;

  .sub{text-align:center;color:#5A7490;font-size:.85rem;margin-bottom:28px}
  #btn-all{display:block;margin:0 auto 28px;padding:13px 40px;border:none;border-radius:12px;
    background:linear-gradient(120deg,#C4922E,#E5B96A);color:#050C18;
    font-weight:900;font-size:1rem;cursor:pointer;letter-spacing:.5px;
    box-shadow:0 4px 24px rgba(196,146,46,.35)}
  #btn-all:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(196,146,46,.5)}
  #status{text-align:center;color:#5A7490;font-size:.82rem;margin-bottom:16px;min-height:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px}
  .card{background:#060e1a;border:1px solid #0f2035;border-radius:14px;
    padding:16px;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 4px 32px rgba(0,0,0,.5)}
  .card h3{font-size:.72rem;color:#C4922E;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  canvas{width:100%;border-radius:10px;display:block;
    box-shadow:0 8px 40px rgba(0,0,0,.6)}
  .dl{width:100%;padding:10px;border:none;border-radius:9px;cursor:pointer;
    background:linear-gradient(120deg,#C4922E,#E5B96A);
    color:#050C18;font-weight:800;font-size:.82rem;letter-spacing:.4px;
    transition:.2s;box-shadow:0 2px 12px rgba(196,146,46,.25)}
  .dl:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(196,146,46,.4)}
</style>

<body>
<h1>V3 PARTNER — POSTS PREMIUM</h1>
<p class="sub">21 posts 1080×1080px · Design premium · Instagram &amp; LinkedIn</p>
<div id="status"></div>
<button id="btn-all" onclick="baixarTodos()">⬇️ BAIXAR TODOS OS 21 POSTS</button>
<div class="grid" id="grid"></div>

<script>
const LOGO=new Image(); LOGO.src='../public/logo.jpg';
const W=1080,H=1080;

// ─── PALETTE ────────────────────────────────────────────────
const C={
  navy:'#050C18',navy2:'#091221',navy3:'#0F1E35',
  gold:'#C4922E',goldL:'#E5B96A',goldP:'#F5D99A',
  blue:'#1A4FC4',blueL:'#2E67E8',
  green:'#10B981',red:'#EF4444',
  fg:'#E8EDF5',muted:'#5A7490'
};

function hex(h,a=1){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── CANVAS HELPERS ──────────────────────────────────────────
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function lingrad(ctx,x1,y1,x2,y2,stops){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  return g;
}
function radgrad(ctx,cx,cy,r0,r1,stops){
  const g=ctx.createRadialGradient(cx,cy,r0,cx,cy,r1);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  return g;
}

// ─── BACKGROUND SYSTEMS ─────────────────────────────────────

// Dark navy gradient bg
function bgDark(ctx,c1=C.navy,c2=C.navy2){
  const g=lingrad(ctx,0,0,W,H,[[0,c1],[1,c2]]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

// Dot matrix pattern
function dots(ctx,color=C.gold,alpha=.04,size=3,gap=48){
  ctx.fillStyle=hex(color,alpha);
  for(let x=gap;x<W;x+=gap)for(let y=gap;y<H;y+=gap){
    ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
  }
}

// Diagonal lines pattern
function diagLines(ctx,color=C.gold,alpha=.03){
  ctx.strokeStyle=hex(color,alpha);ctx.lineWidth=1;
  for(let i=-H;i<W+H;i+=60){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();
  }
}

// Gold top accent line (thick, glowing)
function accentTop(ctx){
  const g=lingrad(ctx,0,0,W,0,[[0,'transparent'],[.25,C.gold],[.5,C.goldP],[.75,C.gold],[1,'transparent']]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,4);
  ctx.fillStyle=hex(C.gold,.15);ctx.fillRect(0,4,W,16);
}

// Large glowing orb
function orb(ctx,cx,cy,r,color=C.gold,alpha=.18){
  const g=radgrad(ctx,cx,cy,0,r,[[0,hex(color,alpha)],[.5,hex(color,alpha*.4)],[1,'transparent']]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

// Decorative ring
function ring(ctx,cx,cy,r,color=C.gold,alpha=.15,lw=1.5){
  ctx.strokeStyle=hex(color,alpha);ctx.lineWidth=lw;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
}

// Diagonal color block (bottom right corner)
function diagBlock(ctx,color=C.blueL,alpha=.08){
  ctx.fillStyle=hex(color,alpha);
  ctx.beginPath();ctx.moveTo(W*.55,H);ctx.lineTo(W,H*.35);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

// Bold left accent bar
function leftBar(ctx,color=C.gold,h=H*.5,y=H*.25){
  const g=lingrad(ctx,0,y,0,y+h,[[0,'transparent'],[.3,hex(color,.8)],[.7,hex(color,.8)],[1,'transparent']]);
  ctx.fillStyle=g;ctx.fillRect(0,y,5,h);
}

// ─── LOGO ────────────────────────────────────────────────────
function drawLogo(ctx,x=54,y=50,size=54){
  // Logo image with rounded clip
  ctx.save();
  rrect(ctx,x,y,size,size,12);
  ctx.clip();
  if(LOGO.complete&&LOGO.naturalWidth>0) ctx.drawImage(LOGO,x,y,size,size);
  else{ctx.fillStyle=C.navy3;ctx.fill();}
  ctx.restore();
  // Glow border
  ctx.strokeStyle=hex(C.gold,.5);ctx.lineWidth=2;
  rrect(ctx,x,y,size,size,12);ctx.stroke();
  // Text
  const gx=lingrad(ctx,x+size+12,0,x+size+200,0,[[0,C.gold],[1,C.goldP]]);
  ctx.fillStyle=gx;ctx.font='bold 30px Arial';
  ctx.fillText('V3 PARTNER',x+size+14,y+size/2+11);
}

// ─── TYPOGRAPHY ──────────────────────────────────────────────

// Big gradient headline (left aligned)
function bigHead(ctx,lines,x,y,size=80,lh=96){
  lines.forEach((l,i)=>{
    const txt=typeof l==='string'?l:l.t;
    const style=typeof l==='string'?'white':l.s;
    ctx.font=`900 ${size}px Arial`;
    if(style==='gold'){
      ctx.fillStyle=lingrad(ctx,x,0,x+800,0,[[0,C.gold],[.5,C.goldP],[1,C.goldL]]);
    } else if(style==='blue'){
      ctx.fillStyle=lingrad(ctx,x,0,x+700,0,[[0,C.blueL],[1,C.gold]]);
    } else {
      ctx.fillStyle=C.fg;
    }
    // Text glow
    ctx.shadowColor=style==='gold'?hex(C.gold,.4):style==='blue'?hex(C.blueL,.3):'transparent';
    ctx.shadowBlur=style!=='white'?20:0;
    ctx.fillText(txt,x,y+i*lh);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  });
}

// Centered headline
function centHead(ctx,lines,y,size=72,lh=88){
  ctx.textAlign='center';
  bigHead(ctx,lines,W/2,y,size,lh);
  ctx.textAlign='left';
}

// Eyebrow label
function eyebrow(ctx,text,x,y,color=C.gold){
  ctx.font='bold 24px Arial';ctx.fillStyle=color;
  ctx.fillText(text.toUpperCase(),x,y);
}

// Body text
function bodyText(ctx,text,x,y,maxW=920,lh=42,size=28){
  ctx.font=`${size}px Arial`;ctx.fillStyle=C.muted;
  const words=text.split(' ');let line='',cy=y;
  words.forEach(w=>{
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW){ctx.fillText(line,x,cy);line=w;cy+=lh;}
    else line=t;
  });
  if(line)ctx.fillText(line,x,cy);
}

// ─── UI COMPONENTS ───────────────────────────────────────────

// Tag badge
function badge(ctx,text,x,y,bg2,stroke2,text2=C.fg,r=22){
  ctx.font='bold 22px Arial';
  const tw=ctx.measureText(text).width;
  const pw=tw+40,ph=46;
  ctx.fillStyle=bg2;rrect(ctx,x,y-34,pw,ph,r);ctx.fill();
  ctx.strokeStyle=stroke2;ctx.lineWidth=2;rrect(ctx,x,y-34,pw,ph,r);ctx.stroke();
  ctx.fillStyle=text2;ctx.fillText(text,x+20,y);
}

function goldBadge(ctx,t,x,y){badge(ctx,t,x,y,hex(C.gold,.15),hex(C.gold,.5),C.goldL);}
function blueBadge(ctx,t,x,y){badge(ctx,t,x,y,hex(C.blueL,.15),hex(C.blueL,.5),C.blueL);}
function greenBadge(ctx,t,x,y){badge(ctx,t,x,y,hex(C.green,.15),hex(C.green,.5),C.green);}

// Gold CTA button
function ctaBtn(ctx,text,x,y){
  ctx.font='bold 30px Arial';
  const tw=ctx.measureText(text).width;
  const pw=tw+70,ph=68,r=18;
  const g=lingrad(ctx,x,y-48,x+pw,y,[[0,C.gold],[1,C.goldL]]);
  ctx.fillStyle=g;rrect(ctx,x,y-50,pw,ph,r);ctx.fill();
  ctx.shadowColor=hex(C.gold,.4);ctx.shadowBlur=20;
  ctx.fillStyle=C.navy;ctx.fillText(text,x+35,y-6);
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
}

// Gold divider
function divider(ctx,x,y,w=960){
  const g=lingrad(ctx,x,y,x+w,y,[[0,'transparent'],[.4,hex(C.gold,.4)],[.6,hex(C.gold,.4)],[1,'transparent']]);
  ctx.strokeStyle=g;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();
}

// Bullet item
function bItem(ctx,text,x,y,col=C.gold,size=28){
  ctx.font=`bold ${size}px Arial`;ctx.fillStyle=col;
  ctx.fillText('▸',x,y);
  ctx.font=`${size}px Arial`;ctx.fillStyle='#b0c8e0';
  ctx.fillText(text,x+36,y);
}

// Check item
function chk(ctx,text,x,y,ok=true,size=28){
  const col=ok?C.green:C.red;
  ctx.font=`bold ${size}px Arial`;ctx.fillStyle=col;
  ctx.fillText(ok?'✓':'✗',x,y);
  ctx.font=`${size}px Arial`;ctx.fillStyle=ok?'#90c8a8':'#c09898';
  ctx.fillText(text,x+44,y);
}

// Stat block
function statBlock(ctx,num,label,x,y,w=220,col=C.gold){
  // Card
  ctx.fillStyle=hex(C.navy3,.9);
  rrect(ctx,x,y,w,130,16);ctx.fill();
  ctx.strokeStyle=hex(col,.3);ctx.lineWidth=2;
  rrect(ctx,x,y,w,130,16);ctx.stroke();
  // Top line
  const g=lingrad(ctx,x,y,x+w,y,[[0,'transparent'],[.5,hex(col,.8)],[1,'transparent']]);
  ctx.strokeStyle=g;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x+16,y);ctx.lineTo(x+w-16,y);ctx.stroke();
  // Number
  ctx.font='bold 56px Arial';ctx.fillStyle=col;
  ctx.textAlign='center';
  ctx.shadowColor=hex(col,.5);ctx.shadowBlur=18;
  ctx.fillText(num,x+w/2,y+80);
  ctx.shadowBlur=0;
  // Label
  ctx.font='20px Arial';ctx.fillStyle=C.muted;
  ctx.fillText(label,x+w/2,y+110);
  ctx.textAlign='left';
}

// Level row
function levelRow(ctx,lv,title,sub,x,y,col=C.green){
  ctx.fillStyle=hex(C.navy3,.8);
  rrect(ctx,x,y,960,88,14);ctx.fill();
  ctx.strokeStyle=hex(col,.3);ctx.lineWidth=2;
  rrect(ctx,x,y,960,88,14);ctx.stroke();
  // Level pill
  ctx.fillStyle=hex(col,.2);
  rrect(ctx,x+14,y+16,66,56,12);ctx.fill();
  ctx.strokeStyle=hex(col,.5);rrect(ctx,x+14,y+16,66,56,12);ctx.stroke();
  ctx.font='bold 26px Arial';ctx.fillStyle=col;ctx.textAlign='center';
  ctx.fillText(lv,x+14+33,y+52);ctx.textAlign='left';
  ctx.font='bold 28px Arial';ctx.fillStyle=C.fg;ctx.fillText(title,x+96,y+40);
  ctx.font='22px Arial';ctx.fillStyle=C.muted;ctx.fillText(sub,x+96,y+68);
}

// Module pill
function modPill(ctx,text,x,y,col=C.gold){
  ctx.font='23px Arial';
  const tw=ctx.measureText(text).width;
  ctx.fillStyle=hex(C.navy3,.9);rrect(ctx,x,y-26,tw+52,48,24);ctx.fill();
  ctx.strokeStyle=hex(col,.35);ctx.lineWidth=1.5;rrect(ctx,x,y-26,tw+52,48,24);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+22,y-2,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9ab0c8';ctx.fillText(text,x+38,y);
}

// Progress bar
function progressBar(ctx,label,pct,x,y,w=900,col=C.gold){
  ctx.font='bold 24px Arial';ctx.fillStyle='#9ab0c8';ctx.fillText(label,x,y-8);
  const pctTxt=pct+'%';ctx.textAlign='right';ctx.fillStyle=col;ctx.fillText(pctTxt,x+w,y-8);
  ctx.textAlign='left';
  ctx.fillStyle=hex(C.navy3,1);rrect(ctx,x,y,w,18,9);ctx.fill();
  const g=lingrad(ctx,x,y,x+w*pct/100,y,[[0,col],[1,C.goldL]]);
  ctx.fillStyle=g;rrect(ctx,x,y,w*pct/100,18,9);ctx.fill();
  ctx.shadowColor=hex(col,.5);ctx.shadowBlur=8;
  ctx.fillStyle=g;rrect(ctx,x,y,w*pct/100,18,9);ctx.fill();
  ctx.shadowBlur=0;
}

// ─── GLOW TEXT HELPER ────────────────────────────────────────
function glowText(ctx,text,x,y,color,size,blur=30){
  ctx.font=`900 ${size}px Arial`;
  ctx.shadowColor=color;ctx.shadowBlur=blur;
  ctx.fillStyle=color;ctx.fillText(text,x,y);
  ctx.fillText(text,x,y);
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
}

// ─── GEOMETRIC DECO ──────────────────────────────────────────
function hexShape(ctx,cx,cy,r,color,alpha=.06,fill=true){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i-Math.PI/6;
    i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath();
  if(fill){ctx.fillStyle=hex(color,alpha);ctx.fill();}
  else{ctx.strokeStyle=hex(color,alpha);ctx.lineWidth=1.5;ctx.stroke();}
}

function dataBar(ctx,num,label,x,y,w=880,col=C.gold){
  ctx.fillStyle=hex(col,.08);rrect(ctx,x,y,w,100,14);ctx.fill();
  ctx.strokeStyle=hex(col,.25);ctx.lineWidth=2;rrect(ctx,x,y,w,100,14);ctx.stroke();
  ctx.font='bold 58px Arial';ctx.fillStyle=col;
  ctx.shadowColor=hex(col,.5);ctx.shadowBlur=20;
  ctx.fillText(num,x+28,y+72);ctx.shadowBlur=0;
  ctx.font='27px Arial';ctx.fillStyle='#9ab0c8';ctx.fillText(label,x+160,y+64);
}

// ─────────────────────────────────────────────────────────────
//  POSTS
// ─────────────────────────────────────────────────────────────
const POSTS=[

/* ── 05 MESA DE CRÉDITO ───────────────────────────────────── */
{name:'05-mesa-credito',title:'Post 5 — Mesa de Crédito',
draw(ctx){

  orb(ctx,W/2,0,500,C.gold,.12);

// ─── RENDER ─────────────────────────────────────────────────
function renderAll(){
  document.getElementById('status').textContent='✓ '+POSTS.length+' posts gerados — clique em "Baixar" para salvar cada PNG';
  const g=document.getElementById('grid');
  POSTS.forEach(p=>{
    const c=mk();
    try{p.draw(c.getContext('2d'));}catch(e){console.error(p.name,e);}
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<h3>${p.title}</h3>`;
    card.appendChild(c);
    const btn=document.createElement('button');btn.className='dl';
    btn.textContent='⬇️ Baixar PNG — '+p.name;
    btn.onclick=()=>{const a=document.createElement('a');a.download='v3partner-'+p.name+'.png';a.href=c.toDataURL('image/png');a.click();};
    card.appendChild(btn);
    g.appendChild(card);
  });
}

function baixarTodos(){
  const btn=document.getElementById('btn-all');
  btn.disabled=true;btn.textContent='⏳ Baixando...';
  const canvases=document.querySelectorAll('canvas');
  canvases.forEach((c,i)=>{
    setTimeout(()=>{
      const a=document.createElement('a');
      a.download='v3partner-'+POSTS[i].name+'.png';
      a.href=c.toDataURL('image/png');a.click();
      if(i===canvases.length-1){btn.disabled=false;btn.textContent='✅ Todos baixados!';}
    },i*350);
  });
}

LOGO.onload=renderAll;
LOGO.onerror=renderAll;
window.addEventListener('DOMContentLoaded',()=>{if(LOGO.complete)renderAll();});
